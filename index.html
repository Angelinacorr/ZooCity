<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Escena 3D - León, Ñu y Lobo</title>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <a-scene>
        <a-entity position="0 3 5">
            <a-camera>
                <a-cursor></a-cursor>
            </a-camera>
        </a-entity>

        <a-sky src="fondo-prueba.jpg"></a-sky>

        <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30"
                 src="piedra.jpg" shadow></a-plane>

        <a-entity position="-2 0 -5" scale="0.8 0.8 0.8"
                  gltf-model="lion/scene.gltf"
                  sound="src: Audios/lion.mp3; autoplay: true; loop: true; volume: 1"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        </a-entity>

        <a-entity position="0 0 -5" scale="0.8 0.8 0.8"
                  gltf-model="wildebeest/scene.gltf"
                  sound="src: Audios/ñu.mp3; autoplay: true; loop: true; volume: 1"
                  animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 0.5 -5">
        </a-entity>

        <a-entity position="2 0 -5" scale="0.02 0.02 0.02"
                  gltf-model="wolf/scene.gltf"
                  sound="src: Audios/wolf.mp3; autoplay: true; loop: true; volume: 1"
                  animation="property: scale; dir: alternate; dur: 1500; loop: true; to: 0.04 0.04 0.04">
        </a-entity>
    </a-scene>

</body>
</html>
